<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARISS OfficeQuest V3</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <h1>🏆 HARISS <span>OfficeQuest</span></h1>
        <p>Transformez vos tâches en quêtes. Gagnez de l'XP. Montez de niveau.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Connexion</button>
        <button class="tab-btn" data-tab="register">Inscription</button>
      </div>

      <form id="login-form" class="auth-form active">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required placeholder="vous@entreprise.com" />

        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" required placeholder="••••••••" />

        <button type="submit" class="btn-primary">Se connecter</button>
        <p class="form-message" id="login-message"></p>
      </form>

      <form id="register-form" class="auth-form">
        <label for="register-name">Nom complet</label>
        <input type="text" id="register-name" required placeholder="Jean Dupont" />

        <label for="register-email">Email</label>
        <input type="email" id="register-email" required placeholder="vous@entreprise.com" />

        <label for="register-password">Mot de passe</label>
        <input type="password" id="register-password" required minlength="6" placeholder="6 caractères min." />

        <button type="submit" class="btn-primary">Créer mon compte</button>
        <p class="form-message" id="register-message"></p>
      </form>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
