services:
  - type: web
    name: hariss-officequest-v3
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: hariss-officequest-db
          property: connectionString

databases:
  - name: hariss-officequest-db
    plan: free
    region: frankfurt
    databaseName: hariss_officequest
    user: hariss_admin
